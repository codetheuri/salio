root = "."
tmp_dir = "tmp"

[build]
  # The binary file to execute
  bin = "./tmp/api"

  # The build command. Points at cmd/api, not the repo root — server-v2 has no
  # main package at its root, so Air's own default guess ("build .") finds
  # nothing there and fails with "no Go files in <dir>".
  cmd = "go build -o ./tmp/api ./cmd/api"

  # Delay before building after file change (ms)
  delay = 500

  # Ignore these directories
  exclude_dir = ["tmp", "vendor", "bin"]

  exclude_file = []
  exclude_regex = ["_test.go"]

  # Watch these extensions — sql included so a new migration file restarts too
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "env", "sql"]

  kill_delay = "500ms"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true
