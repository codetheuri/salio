# Continuous integration for both backends and the mobile app.
#
# Replaces the original go.yml, which ran `go build ./...` at the repository
# root — where there is no Go module — with Go 1.20, and only for main. It
# could not build anything, so it never checked anything.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-v2:
    name: server-v2 (format, vet, test with PostgreSQL, vulnerabilities)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-v2

    services:
      postgres:
        image: postgres:15
        env:
          # The tests' default DSN (internal/testsupport): root:root@127.0.0.1:5434/salio_v2_test.
          # A superuser on purpose — the tests create databases and the
          # restricted role that internal/server's tests run the API as.
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: salio_v2_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U root -d salio_v2_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server-v2/go.mod
          cache-dependency-path: server-v2/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-ed:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # REQUIRE_DB_TESTS turns "no database, skipping" into a failure, so a
      # green build can never mean the database tests did not run.
      - name: Test
        env:
          REQUIRE_DB_TESTS: "1"
        run: go test -race -count=1 ./...

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  server-v2-image:
    name: server-v2 (container image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t salio-api:ci server-v2

  server-v1:
    name: server (v1, build and vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go build ./...
      - run: go vet ./...

  mobile-v2:
    name: mobile-v2 (format, analyze, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-v2
    steps:
      - uses: actions/checkout@v4

      # AGP 9 needs JDK 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The exact Flutter release pinned in pubspec.yaml (docs/10, D18).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile-v2/pubspec.yaml
          cache: true

      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # The drift code is committed (as in DairyGo); regenerating must change
      # nothing, or a table was edited without running the generator.
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze --fatal-infos

      # Includes the layout tests (every screen, size, text size and
      # language) and the shared vectors in ../testdata/shared.
      - name: Test
        run: flutter test

      # A real Gradle build: flavours, manifest and resources. Debug, because
      # the release key is never on CI.
      - name: Build (dev, one APK per processor type)
        run: flutter build apk --debug --flavor dev --split-per-abi

      - name: Every APK has the right version code and its native libraries
        run: scripts/check-apks.sh

  mobile-v2-live:
    name: mobile-v2 (live scenarios against a real server-v2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-v2

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U root -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server-v2/go.mod
          cache-dependency-path: server-v2/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile-v2/pubspec.yaml
          cache: true

      - run: flutter pub get

      # A throwaway server-v2 on :8091: fresh database, the two roles,
      # migrations, and the API as the restricted role with row-level
      # security required. The same script runs it on a laptop.
      - name: Start server-v2
        run: |
          scripts/live-server.sh > live-server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8091/health && exit 0
            sleep 1
          done
          cat live-server.log
          exit 1

      - name: Live scenarios
        env:
          SALIO_LIVE_URL: http://127.0.0.1:8091
        run: flutter test test/live

      - name: Server log
        if: always()
        run: cat live-server.log
